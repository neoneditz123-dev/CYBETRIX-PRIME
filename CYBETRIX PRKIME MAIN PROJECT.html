\"receive\" money is a classic QR payment scam.'\n    });\n  }\n\n  const urgencyWords = ['urgent', 'immediately', 'blocked', 'suspended', '24 hours', 'kyc', 'verify now', 'unpaid toll', 'customs duty', 'act now', 'expire', 'last warning', 'claim'];\n  const matchedUrgency = urgencyWords.filter(w => lower.includes(w));\n  if (matchedUrgency.length > 0) {\n    const w = Math.min(32, matchedUrgency.length * 11);\n    score += w;\n    reasons.push({\n      factor: 'High-Pressure Urgency & Coercion Language',\n      weight: `+${w}`,\n      detail: `Detected coercive triggers: \"${matchedUrgency.join('\", \"')}\" designed to rush victim action.`\n    });\n  }\n\n  const brandImpersonation = ['sbi', 'hdfc', 'icici', 'rbi', 'indiapost', 'india post', 'fastag', 'netflix', 'paypal', 'microsoft', 'eth', 'binance', 'income tax', 'amazon', 'google'];\n  const matchedBrands = brandImpersonation.filter(b => lower.includes(b));\n  if (matchedBrands.length > 0 && (lower.includes('http') || lower.includes('kyc') || lower.includes('verify') || lower.includes('bonus') || lower.includes('pay') || lower.includes('.xyz') || lower.includes('.top') || lower.includes('-gov') || lower.includes('update'))) {\n    score += 26;\n    reasons.push({\n      factor: 'Brand / Institutional Entity Impersonation',\n      weight: '+26',\n      detail: `References trusted entity (${matchedBrands.join(', ').toUpperCase()}) outside verified sovereign/official domains.`\n    });\n  }\n\n  const urlMatches = text.match(/(https?:\\/\\/[^\\s]+|upi:\\/\\/[^\\s]+|[a-zA-Z0-9-]+\\.(xyz|top|tk|ml|ga|cf|in|org|com|net|io|co)(\\/[^\\s]*)?)/gi) || [];\n  urlMatches.forEach(u => {\n    extractedIndicators.push({ type: 'URL/URI', value: u });\n    if (/\\.(xyz|top|tk|ml|buzz|click|club|online|site)/i.test(u) || /(kyc|verify|secure|update|bonus|toll|pay-duty|login|claim|free)/i.test(u)) {\n      score += 28;\n      reasons.push({\n        factor: 'Suspicious Lookalike / High-Risk TLD Infrastructure',\n        weight: '+28',\n        detail: `Target \"${u}\" exhibits deceptive lure tokens or high-abuse top-level domain.`\n      });\n    } else if (/gov\\.in|nic\\.in|sbi\\.co\\.in|hdfcbank\\.com|google\\.com|wikipedia\\.org/i.test(u)) {\n      score = Math.max(5, score - 22);\n      reasons.push({\n        factor: 'Verified Official Domain Match',\n        weight: '-22',\n        detail: `Domain \"${u}\" matches an authentic institutional domain.`\n      });\n    }\n  });\n\n  if (lower.startsWith('http://')) {\n    score += 14;\n    reasons.push({\n      factor: 'Unencrypted Plaintext HTTP Transport',\n      weight: '+14',\n      detail: 'Destination lacks TLS encryption (http://), anomalous for legitimate authentication or payment portals.'\n    });\n  }\n\n  const phoneMatches = text.match(/(\\+?\\d{1,3}[-.\\s]?\\d{5}[-.\\s]?\\d{5}|\\+?\\d{10,13})/g) || [];\n  phoneMatches.forEach(p => {\n    extractedIndicators.push({ type: 'Phone Number', value: p.trim() });\n    if (p.includes('98204') || p.includes('70119')) {\n      score += 25;\n      reasons.push({\n        factor: 'Known VoIP / Burner Cluster Match (PS03)',\n        weight: '+25',\n        detail: `Number ${p.trim()} is flagged in Telecom Intelligence for high-velocity SMiShing bursts.`\n      });\n    }\n  });\n\n  const upiMatches = text.match(/[\\w.-]+@(okaxis|oksbi|okicici|ybl|paytm|upi|ibl)/gi) || [];\n  const walletMatches = text.match(/0x[a-fA-F0-9]{16,42}/g) || [];\n  [...upiMatches, ...walletMatches].forEach(fin => {\n    extractedIndicators.push({ type: 'Payment ID', value: fin });\n    score += 27;\n    reasons.push({\n      factor: 'Flagged Financial / Mule Destination (PS05)',\n      weight: '+27',\n      detail: `Identifier \"${fin}\" matches mule-account or smart-contract drainer telemetry.`\n    });\n  });\n\n  if (reasons.length === 0) {\n    reasons.push({\n      factor: 'Baseline Heuristic & Reputation Check',\n      weight: '+12',\n      detail: 'No known malicious IOCs, coercive urgency triggers, or lookalike domains detected in active feeds.'\n    });\n  }\n\n  score = Math.min(99, Math.max(4, score));\n  const classification =\n    score >= 80 ? 'CRITICAL' :\n    score >= 55 ? 'HIGH' :\n    score >= 30 ? 'MEDIUM' : 'LOW / SAFE';\n\n  const confidence = score >= 75 || score <= 15 ? 'High (95%)' : 'Moderate (79%)';\n\n  return {\n    detectedType,\n    score,\n    classification,\n    confidence,\n    reasons,\n    extractedIndicators,\n    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ' IST'\n  };\n}\n\n// ============================================================================\n// MAIN APPLICATION COMPONENT\n// ============================================================================\n\nfunction App() {\n  // Settings State (Persisted to localStorage)\n  const [settings, setSettings] = useState(() => {\n    try {\n      const saved = localStorage.getItem('cybetrix_prime_settings_v2');\n      if (saved) return JSON.parse(saved);\n    } catch {}\n    return {\n      themeId: 'cybetrix_navy',\n      disableDemoData: false,\n      autoRouteQuickScan: false,\n      autoSaveHighRisk: true,\n      riskThreshold: 70,\n      soundAlerts: true,\n      groqApiKey: ''\n    };\n  });\n\n  useEffect(() => {\n    try {\n      localStorage.setItem('cybetrix_prime_settings_v2', JSON.stringify(settings));\n    } catch {}\n  }, [settings]);\n\n  const theme = THEMES[settings.themeId] || THEMES.cybetrix_navy;\n\n  // Navigation & Drawer State\n  const [activeTab, setActiveTab] = useState('dashboard');\n  const [hamburgerOpen, setHamburgerOpen] = useState(false);\n  const [toast, setToast] = useState(null);\n\n  // User-Created Investigation State (persists even when Demo Data is disabled!)\n  const [userCases, setUserCases] = useState([]);\n  const [userScans, setUserScans] = useState([]);\n  const [userTimeline, setUserTimeline] = useState([]);\n  const [userIocs, setUserIocs] = useState([]);\n\n  // Combined Effective Data (Respec     setSmsResult(analyzeInputUnified(`${smsSender}: ${smsText}`, 'SMS'));\n  }, []);\n\n  // Beep sound helper using Web Audio API (when soundAlerts enabled)\n  const playDetectionTone = useCallback(() => {\n    if (!settings.soundAlerts) return;\n    try {\n      const ctx = new (window.AudioContext || window.webkitAudioContext)();\n      const osc = ctx.createOscillator();\n      const gain = ctx.createGain();\n      osc.type = 'sine';\n      osc.frequency.setValueAtTime(880, ctx.currentTime);\n      osc.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.12);\n      gain.gain.setValueAtTime(0.08, ctx.currentTime);\n      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);\n      osc.connect(gain);\n      gain.connect(ctx.destination);\n      osc.start();\n      osc.stop(ctx.currentTime + 0.16);\n    } catch {}\n  }, [settings.soundAlerts]);\n\n  // Helper to attach indicator to active case (creates a live case automatically if demo data is disabled & no cases exist)\n  const attachIndicatorToCase = useCallback((type, value, risk, moduleName, source = 'Analyst Submission') => {\n    let targetCaseId = activeCase?.id;\n\n    if (!targetCaseId) {\n      targetCaseId = `CASE-${new Date().getFullYear()}-${Math.floor(100 + Math.random() * 899)}`;\n      const freshCase = {\n        id: targetCaseId,\n        title: `Live Investigation — ${type} Indicator Triage`,\n        psTag: 'PS01 / Active Triage',\n        severity: risk >= 80 ? 'CRITICAL' : 'HIGH',\n        status: 'Active Investigation',\n        lead: 'Lead Investigator',\n        created: new Date().toLocaleString(),\n        updated: 'Just now',\n        summary: 'Live investigation initialized from real-time scan telemetry.',\n        indicators: [\n          {\n            id: `IND-${Math.floor(400 + Math.random() * 500)}`,\n            type,\n            value,\n            risk,\n            module: moduleName,\n            source\n          }\n        ],\n        notes: [`   ]);\n\n    setUserIocs(prev => [\n      {\n        id: `IOC-LIVE-${Date.now()}`,\n        indicator: value,\n        type,\n        category: moduleName,\n        risk,\n        feed: 'Cybetrix Live Telemetry',\n        updated: 'Just now',\n        caseId: targetCaseId\n      },\n      ...prev\n    ]);\n\n    showToast(`Linked ${type} to ${targetCaseId} & updated Timeline`);\n  }, [activeCase, userCases, showToast]);\n\n  const recordScan = useCallback((type, target, analysis) => {\n    const newScan = {\n      id: `SCN-${Math.floor(100 + Math.random() * 899)}`,\n      time: analysis.timestamp,\n      type,\n      target: target.length > 56 ? target.slice(0, 56) + '...' : target,\n      verdict: analysis.classification,\n      score: analysis.score,\n      caseId: activeCase?.id || 'LIVE-SESSION'\n    };\n    setUserScans(prev => [newScan, ...prev]);\n    if (settings.autoSaveHighRisk && analysis.score >= settings.riskThreshold) {\n      attachIndicatorToCase(type, target, analysis.score, `${type} Auto-Capture`);\n    }\n  }, [activeCase, settings.autoSaveHighRisk, settings.riskThreshold, attachIndicatorToCase]);\n\n  // ============================================================================\n  // REAL LIVE CAMERA QR CODE SCANNER LOGIC (getUserMedia + BarcodeDetector + jsQR)\n  // ============================================================================\n\n  const stopCamera = useCallback(() => {\n    if (scanLoopRef.current) {\n      cancelAnimationFrame(scanLoopRef.current);\n      scanLoopRef.current = null;\n    }\n    if (streamRef.current) {\n      streamRef.current.getTracks().forEach(track => track.stop());\n      streamRef.current = null;\n    }\n    setCameraActive(false);\n    setCameraStatus('idle');\n  }, []);\n\n  useEffect(() => {\n    return () => stopCamera();\n  }, [stopCamera]);\n\n  const handleQrPayloadDetected = useCallback((rawPayload, sourceLabel = 'Live Camera QR') => {\n    const cleaned = (rawPayload || '').trim();\n    if (!cleaned) return;\n    setLastScannedQrRaw(cleaned);\n    setUrlInput(cleaned);\n    setQrFlash(true);\n    setTimeout(() => setQrFlash(false), 900);\n    playDetectionTone();\n\n    const analysis = analyzeInputUnified(cleaned, 'URL');\n    setUrlResult(analysis);\n    recordScan('QR Code', cleaned, analysis);\n    showToast(`QR Decoded (${sourceLabel}): ${cleaned.slice(0, 42)}${cleaned.length > 42 ? '...' : ''}`);\n    stopCamera();\n  }, [playDetectionTone, recordScan, showToast, stopCamera]);\n\n  const startLiveCameraQr = async () => {\n    setCameraErrorMsg('');\n    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {\n      setCameraStatus('unsupported');\n      setCameraErrorMsg('Camera API (getUserMedia) is unavailable in this browser or sandboxed preview. Use \"Upload QR Image\" below to decode any QR screenshot.');\n      return;\n    }\n\n    try {\n      setCameraStatus('requesting');\n      const stream = await navigator.mediaDevices.getUserMedia({\n        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },\n        audio: false\n      });\n\n      streamRef.current = stream;\n      setCameraActive(true);\n      setCameraStatus('active');\n\n      // Wait a tick for video element to mount\n      setTimeout(() => {\n        if (!videoRef.current) return;\n        videoRef.current.srcObject = stream;\n        videoRef.current.setAttribute('playsinline', 'true');\n        videoRef.current.play().catch(() => {});\n\n        let detector = null;\n        if ('BarcodeDetector' in window) {\n          try {\n            detector = new window.BarcodeDetector({ formats: ['qr_code'] });\n          } catch {}\n        }\n\n        const tick = async () => {\n          if (!videoRef.current || !streamRef.current) return;\n          const video = videoRef.current;\n\n          if (video.readyState === video.HAVE_ENOUGH_DATA) {\n            // 1. Try native BarcodeDetector first\n            if (detector) {\n              try {\n                const codes = await detector.detect(video);\n                if (codes && codes.length > 0 && codes[0].rawValue) {\n                  handleQrPayloadDetected(codes[0].rawValue, 'Live Camera');\n                  return;\n                }\n              } catch {}\n            }\n\n            // 2. Fallback to jsQR canvas frame decoding\n            if (window.jsQR && canvasRef.current) {\n              const canvas = canvasRef.current;\n              const ctx = canvas.getContext('2d', { willReadFrequently: true });\n              canvas.width = video.videoWidth;\n              canvas.height = video.videoHeight;\n              ctx.drawImage(video, 0, 0, canvas.width, canvas.height);\n              const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);\n              const qr = window.jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: 'dontInvert' });\n              if (qr && qr.data) {\n                handleQrPayloadDetected(qr.data, 'Live Camera');\n                return;\n              }\n            }\n          }\n          scanLoopRef.current = requestAnimationFrame(tick);\n        };\n\n        scanLoopRef.current = requestAnimationFrame(tick);\n      }, 120);\n    } catch (err) {\n      setCameraActive(false);\n      setCameraStatus('denied');\n      setCameraErrorMsg(\n        err?.name === 'NotAllowedError'\n          ? 'Camera permission was denied by the browser or iframe sandbox. Please allow camera access in browser site settings, or upload a QR image file below.'\n          : `Unable to access camera (${err?.message || 'Device unavailable'}). Use \"Upload QR Image\" below to decode any QR screenshot.`\n      );\n    }\n  };\n\n  // Decode QR from uploaded image file\n  const handleQrImageUpload = (e) => {\n    const file = e.target.files?.[0];\n    if (!file) return;\n    const reader = new FileReader();\n    reader.onload = (ev) => {\n      const img = new Image();\n      img.onload = async () => {\n        const canvas = document.createElement('canvas');\n        canvas.width = img.width;\n        canvas.height = img.height;\n        const ctx = canvas.getContext('2d');\n        ctx.drawImage(img, 0, 0);\n\n        // Try native BarcodeDetector\n        if ('BarcodeDetector' in window) {\n          try {\n            const det = new window.BarcodeDetector({ formats: ['qr_code'] });\n            const res = await det.detect(canvas);\n            if (res?.[0]?.rawValue) {\n              handleQrPayloadDetected(res[0].rawValue, `Uploaded Image (${file.name})`);\n              return;\n            }\n          } catch {}\n        }\n\n        // Try jsQR\n        if (window.jsQR) {\n          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);\n          const code = window.jsQR(imgData.data, imgData.width, imgData.height);\n          if (code?.data) {\n            handleQrPayloadDetected(code.data, `Uploaded Image (${file.name})`);\n            return;\n          }\n        }\n\n        showToast('No readable QR code found in the uploaded image.');\n      };\n      img.src = ev.target.result;\n    };\n    reader.readAsDataURL(file);\n    e.target.value = '';\n  };\n\n  // ============================================================================\n  // FLOATING CYBETRIX COPILOT (GROQ OPTIONAL + LOCAL EVIDENCE-GROUNDED ENGINE)\n  // ============================================================================\n\n  const sendCopilotMessage = async (promptOverride = null) => {\n    const query = (promptOverride || copilotInput).trim();\n    if (!query) return;\n    setCopilotInput('');\n    setCopilotMessages(prev => [...prev, { role: 'user', text: query }]);\n    setCopilotLoading(true);\n\n    const contextSummary = `Active Module: ${activeTab}. Demo Data Disabled: ${settings.disableDemoData}. Active Cases: ${cases.length}. Current Case: ${activeCase ? `${activeCase.id} (${activeCase.title}) with ${activeCase.indicators.length} indicators` : 'None'}. Latest URL/QR Target: ${urlInput}.`;\n\n    // Optional Groq Live LLM call if user provided API key in Settings\n    if (settings.groqApiKey && settings.groqApiKey.trim().startsWith('gsk_')) {\n      try {\n        const resp = await fetch('https://api.groq.com/openai/v1/chat/completions', {\n          method: 'POST',\n          headers: {\n            'Content-Type': 'application/json',\n            Authorization: `Bearer ${settings.groqApiKey.trim()}`\n          },\n          body: JSON.stringify({\n            model: 'llama-3.3-70b-versatile',\n            messages: [\n              {\n                role: 'system',\n                content: `You are CYBETRIX COPILOT, an expert digital fraud investigator and incident-response AI inside CYBETRIX PRIME. Ground your answers strictly in the workspace context: ${contextSummary}. Be concise, structured, and distinguish facts from hypotheses.`\n              },\n              { role: 'user', content: query }\n            ],\n            temperature: 0.3,\n            max_tokens: 420\n          })\n        });\n        const data = await resp.json();\n        const reply = data?.choices?.[0]?.message?.content;\n        if (reply) {\n          setCopilotMessages(prev => [...prev, { role: 'assistant', text: reply }]);\n          setCopilotLoading(false);\n          return;\n        }\n      } catch {}\n    }\n\n    // Evidence-Grounded Local Reasoning Engine Fallback\n    setTimeout(() => {\n      const q = query.toLowerCase();\n      let reply = '';\n      if (q.includes('case') || q.includes('summarize')) {\n        reply = activeCase\n          ? `📋 **Case Brief (${activeCase.id})**: \"${activeCase.title}\" [${activeCase.severity}]. Currently tracking ${activeCase.indicators.length} linked indicators across ${activeCase.psTag}. Recommended next step: Open **SCAMBREAK** to verify golden-hour freeze actions or export the **Evidence Pack** for 1930/CERT-In reporting.`\n          : `Workspace is in **Clean Production Mode** (Demo Data disabled) with 0 active cases. Scan a URL, QR code, Email, or SMS to auto-initialize your first live case file.`;\n      } else if (q.includes('qr') || q.includes('url') || q.includes('risk')) {\n        reply = `🔍 **URL / QR Threat Assessment**: Currently inspecting \\`${urlInput}\\` (Score: **${urlResult?.score ?? 0}/100** — ${urlResult?.classification ?? 'PENDING'}). ${urlResult?.reasons?.[0]?.detail || 'Run a scan to inspect domain age, lookalike similarity, and payment URI intents.'}`;\n      } else if (q.includes('scambreak') || q.includes('1930') || q.includes('freeze') || q.includes('help')) {\n        reply = `🔥 **SCAMBREAK Golden-Hour Protocol**:\\n1. Dial **1930** (National Cyber Crime Helpline) within 60 mins with UTR & beneficiary UPI/account.\\n2. Freeze compromised cards/UPI via bank emergency hotline.\\n3. Revoke active sessions & enable app-based MFA.\\n4. Log complaint at **cybercrime.gov.in** with Cybetrix Evidence Pack.`;\n      } else if (q.includes('scamlink') || q.includes('correlate') || q.includes('graph')) {\n        reply = `🕸️ **ScamLink Correlation Insight**: Cross-referencing PS01 phishing infrastructure, PS03 VoIP burst numbers, and PS05 Layer-1 mule handles reveals shared campaign artifacts. Remember: technical correlation establishes shared infrastructure, not standalone legal attribution.`;\n      } else {\n        reply = `🛡️ **Cybetrix Copilot Analysis**: Based on your current **${activeTab.toUpperCase()}** workspace (${cases.length} active cases, ${scanHistory.length} logged scans), I recommend validating all extracted domains/UPI handles against Threat Feeds and syncing high-risk findings into **${activeCase?.id || 'a new Case File'}**.`;\n      }\n      setCopilotMessages(prev => [...prev, { role: 'assistant', text: reply }]);\n      setCopilotLoading(false);\n    }, 350);\n  };\n\n  // Badge helper\n  const getRiskBadge = (scoreOrLabel) => {\n    const val = typeof scoreOrLabel === 'number' ? scoreOrLabel : null;\n    const label = String(scoreOrLabel).toUpperCase();\n    if ((val !== null && val >= 80) || label.includes('CRITICAL')) {\n      return 'bg-red-500/15 text-red-400 border border-red-500/35';\n    }\n    if ((val !== null && val >= 55) || label.includes('HIGH')) {\n      return 'bg-orange-500/15 text-orange-400 border border-orange-500/35';\n    }\n    if ((val !== null && val >= 30) || label.includes('MEDIUM')) {\n      return 'bg-amber-500/15 text-amber-400 border border-amber-500/35';\n    }\n    return 'bg-emerald-500/15 text-emerald-400 border border-emerald-500/35';\n  };\n\n  const navGroups = [\n    {\n      label: 'COMMAND & RESPONSE',\n      items: [\n        { id: 'dashboard', name: 'Command Center', icon: Activity },\n        { id: 'scambreak', name: 'SCAMBREAK Response', icon: Flame, badge: 'CORE' },\n        { id: 'scamlink', name: 'ScamLink Graph', icon: Network },\n      ]\n    },\n    {\n      label: 'PS01 · FRAUD & PHISHING',\n      items: [\n        { id: 'email', name: 'Email Phishing AI', icon: Mail },\n        { id: 'url_qr', name: 'URL & Live QR Scanner', icon: QrCode },\n        { id: 'sms', name: 'SMS & SMiShing', icon: MessageSquare },\n      ]\n    },\n    {\n      label: 'PS02 · PS03 · PS05 INTEL',\n      items: [\n        { id: 'osint', name: 'OSINT Investigator (PS02)', icon: Eye },\n        { id: 'telecom', name: 'Telecom & CDR (PS03)', icon: Phone },\n        { id: 'financial', name: 'Money-Trail Intel (PS05)', icon: Landmark },\n      ]\n    },\n    {\n      label: 'WORKSPACE & SYSTEM',\n      items: [\n        { id: 'cases', name: 'Case Files & Evidence', icon: FolderKanban },\n        { id: 'timeline', name: 'Incident Timeline', icon: Clock },\n        { id: 'intel_feeds', name: 'Threat Intel & Feeds', icon: Database },\n        { id: 'reports', name: 'Evidence Pack & Reports', icon: FileText },\n        { id: 'settings', name: 'Platform Settings', icon: Settings, badge: '17 THEMES' },\n      ]\n    }\n  ];\n\n  // ============================================================================\n  // RENDER: ENHANCED MULTI-DOMAIN CHART & DASHBOARD\n  // ============================================================================\n  const renderDashboard = () => {\n    // Build dynamic chart series combining demo trend (if enabled) + live user scans\n    const chartData = settings.disableDemoData\n      ? [\n          { day: 'Day -6', phishing: 0, smishing: 0, financial: 0, osint: 0 },\n          { day: 'Day -5', phishing: 0, smishing: 0, financial: 0, osint: 0 },\n          { day: 'Day -4', phishing: 0, smishing: 0, financial: 0, osint: 0 },\n          { day: 'Day -3', phishing: 0, smishing: 0, financial: 0, osint: 0 },\n          { day: 'Day -2', phishing: 0, smishing: 0, financial: 0, osint: 0 },\n          { day: 'Yesterday', phishing: 0, smishing: 0, financial: 0, osint: 0 },\n          {\n            day: 'Today (Live)',\n            phishing: userScans.filter(s => ['URL', 'Email', 'QR Code'].includes(s.type)).length,\n            smishing: userScans.filter(s => ['SMS', 'Phone'].includes(s.type)).length,\n            financial: userScans.filter(s => s.type === 'Financial').length,\n            osint: userCases.length\n          }\n        ]\n      : DEMO_TREND_SERIES.map((d, i) =>\n          i === DEMO_TREND_SERIES.length - 1\n            ? {\n                ...d,\n                phishing: d.phishing + userScans.filter(s => ['URL', 'Email', 'QR Code'].includes(s.type)).length,\n                smishing: d.smishing + userScans.filter(s => ['SMS', 'Phone'].includes(s.type)).length\n              }\n            : d\n        );\n\n    const maxVal = Math.max(20, ...chartData.flatMap(d => [d.phishing, d.smishing, d.financial, d.osint]));\n    const getCoords = (key) =>\n      chartData.map((d, idx) => {\n        const x = 62 + idx * 92;\n        const y = 172 - (d[key] / maxVal) * 136;\n        return { x, y, val: d[key], day: d.day };\n      });\n\n    const pPts = getCoords('phishing');\n    const sPts = getCoords('smishing');\n    const fPts = getCoords('financial');\n    const oPts = getCoords('osint');\n\n    const toPolyline = (pts) => pts.map(p => `${p.x},${p.y}`).join(' ');\n    const toPolygon = (pts) => `${toPolyline(pts)} ${pts[pts.length - 1].x},172 ${pts[0].x},172`;\n\n    const activeHover = chartData[hoverDayIdx] || chartData[chartData.length - 1];\n\n    // Donut Risk Breakdown stats\n    const critCount = settings.disableDemoData ? scanHistory.filter(s => s.score >= 80).length : 318 + userScans.filter(s => s.score >= 80).length;\n    const highCount = settings.disableDemoData ? scanHistory.filter(s => s.score >= 55 && s.score < 80).length : 412 + userScans.filter(s => s.score >= 55 && s.score < 80).length;\n    const medCount = settings.disableDemoData ? scanHistory.filter(s => s.score >= 30 && s.score < 55).length : 251 + userScans.filter(s => s.score >= 30 && s.score < 55).length;\n    const safeCount = settings.disableDemoData ? scanHistory.filter(s => s.score < 30).length : 160 + userScans.filter(s => s.score < 30).length;\n    const totalRiskItems = Math.max(1, critCount + highCount + medCount + safeCount);\n\n    const critPct = Math.round((critCount / totalRiskItems) * 100);\n    const highPct = Math.round((highCount / totalRiskItems) * 100);\n    const medPct = Math.round((medCount / totalRiskItems) * 100);\n    const safePct = Math.max(0, 100 - critPct - highPct - medPct);\n\n    return (\n      <div className=\"space-y-6\">\n        {/* Hero Quick Scan Command Banner */}\n        <div\n          style={{ backgroundColor: theme.card, borderColor: theme.border }}\n          className=\"border rounded-2xl p-5 sm:p-6 shadow-xl relative overflow-hidden\"\n        >\n          <div className=\"flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4 mb-5\">\n            <div>\n              <div className=\"flex flex-wrap items-center gap-2 text-xs font-semibold tracking-wider uppercase mb-1\" style={{ color: theme.accent }}>\n                <Radio className=\"w-3.5 h-3.5 animate-pulse\" />\n                <span>Unified Multi-Domain Fraud Intelligence · PS01 · PS02 · PS03 · PS05</span>\n                {settings.disableDemoData && (\n                  <span className=\"px-2 py-0.5 rounded bg-emerald-500/15 text-emerald-400 border border-emerald-500/30 text-[10px]\">\n                    LIVE PRODUCTION MODE (DEMO DATA OFF)\n                  </span>\n                )}\n              </div>\n              <h2 className=\"text-xl sm:text-2xl font-bold text-white\">\n                Detect scams. Connect evidence. Support investigations.\n              </h2>\n            </div>\n\n            <div className=\"flex flex-wrap items-center gap-2.5\">\n              <button\n                onClick={() => setActiveTab('url_qr')}\n                style={{ backgroundColor: theme.primary }}\n                className=\"px-4 py-2 rounded-xl hover:opacity-90 text-white text-xs sm:text-sm font-semibold flex items-center gap-2 shadow-lg transition cursor-pointer\"\n              >\n                <Camera className=\"w-4 h-4\" />\n                Live QR Camera Scan\n              </button>\n              <button\n                onClick={() => setActiveTab('scambreak')}\n                className=\"px-4 py-2 rounded-xl bg-red-600 hover:bg-red-500 text-white text-xs sm:text-sm font-semibold flex items-center gap-2 shadow-lg shadow-red-600/20 transition cursor-pointer\"\n              >\n                <Flame className=\"w-4 h-4\" />\n                SCAMBREAK Triage\n              </button>\n            </div>\n          </div>\n\n          <form onSubmit={(e) => {\n            e.preventDefault();\n            if (!quickInput.trim()) return;\n            const res = analyzeInputUnified(quickInput);\n            setQuickResult(res);\n            recordScan(res.detectedType, quickInput, res);\n            if (settings.autoRouteQuickScan) {\n              const route     <div className=\"absolute inset-0 flex flex-col items-center justify-center text-center\">\n                  <span className=\"text-xl font-extrabold text-white\">\n                    {settings.disableDemoData && scanHistory.length === 0 ? '0' : totalRiskItems.toLocaleString()}\n                  </span>\n                  <span className=\"text-[10px] uppercase tracking-wider text-slate-400\">Evaluated</span>\n                </div>\n              </div>\n\n              <div className=\"space-y-2.5 text-xs\">\n                {[\n                  { label: 'Critical (80–100)', pct: critPct, count: critCount, color: 'bg-red-500' },\n                  { label: 'High (55–79)', pct: highPct, count: highCount, color: 'bg-orange-500' },\n                  { label: 'Medium (30–54)', pct: medPct, count: medCount, color: 'bg-amber-400' },\n                  { label: 'Verified Safe (<30)', pct: safePct, count: safeCount, color: 'bg-emerald-500' },\n                ].map((item, i) => (\n                  <div key={i} className=\"flex items-center justify-between\">\n                    <span className=\"flex items-center gap-2 text-slate-300\">\n                      <span className={`w-2.5 h-2.5 rounded-sm ${item.color}`} />\n                      {item.label}\n                    </span>\n                    <span className=\"font-mono text-slate-400\">{item.count} ({item.pct}%)</span>\n                  </div>\n                ))}\n              </div>\n            </div>\n          </div>\n        </div>\n\n        {/* Active Investigations + Recent Scans + Threat Feeds */}\n        <div className=\"grid grid-cols-1 lg:grid-cols-3 gap-6\">\n          <div style={{ backgroundColor: theme.card, borderColor: theme.border }} className=\"border rounded-2xl p-5\">\n            <div className=\"flex items-center justify-between mb-4\">\n              <h3 className=\"text-sm font-bold text-white uppercase tracking-wider\">Active Case Files</h3>\n              <button onCli      </div>\n            )}\n          </div>\n        )}\n      </div>\n    );\n  };\n\n  // ============================================================================\n  // RENDER: SETTINGS MODULE (17 THEMES + DISABLE DEMO DATA + SOC PREFERENCES)\n  // ============================================================================\n  const renderSettings = () => {\n    const handleExportWorkspaceJson = () => {\n      const payload = {\n        exportedAt: new Date().toISOString(),\n        settings,\n        userCases,\n        userScans,\n        userTimeline,\n        userIocs\n      };\n      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });\n      const url = URL.createObjectURL(blob);\n      const a = document.createElement('a');\n      a.href = url;\n      a.download = `Cybetrix_Prime_Workspace_${Date.now()}.json`;\n      a.click();\n      URL.revokeObjectURL(url);\n      showToast('Exported workspace JSON backup');\n    };\n\n    const handleResetSession = () => {\n      setUserCases([]);\n      setUserScans([]);\n      setUserTimeline([]);\n      setUserIocs([]);\n      showToast('Cleared all local session cases and scan logs');\n    };\n\n    return (\n      <div className=\"space-y-6\">\n        <div>\n          <span className=\"text-xs font-semibold uppercase tracking-wider\" style={{ color: theme.accent }}>\n            Workspace Customization & Operational Mode\n          </span>\n          <h2 className=\"text-xl font-bold text-white\">Platform Settings, Themes & Demo Data Controls</h2>\n        </div>\n\n        {/* CRITICAL TOGGLE: DISABLE DEMO DATA FOR REAL PRODUCTION USAGE */}\n        <div\n          style={{ backgroundColor: theme.card, borderColor: settings.disableDemoData ? '#10b981' : theme.border }}\n          className=\"border-2 rounded-2xl p-5 sm:p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4\"\n        >\n          <div className=\"space-y-1\">\n            <div className=\"fle msText, res);\n    };\n    return (\n      <div className=\"space-y-6\">\n        <div>\n          <span className=\"text-xs font-semibold uppercase tracking-wider\" style={{ color: theme.accent }}>PS01 · Mobile & Messaging Fraud</span>\n          <h2 className=\"text-xl font-bold text-white\">SMS Scam & SMiShing Detector</h2>\n        </div>\n        <div className=\"grid grid-cols-1 lg:grid-cols-12 gap-6\">\n          <div style={{ backgroundColor: theme.card, borderColor: theme.border }} className=\"lg:col-span-5 border rounded-2xl p-5 space-y-4\">\n            <input\n              type=\"text\"\n              value={smsSender}\n              onChange={(e) => setSmsSender(e.target.value)}\n              style={{ backgroundColor: theme.cardInner, borderColor: theme.border }}\n              className=\"w-full px-3.5 py-2.5 rounded-xl border text-xs font-mono text-white\"\n            />\n            <textarea\n              rows={5}\n              value={smsText}\n              onChange={(e) => setSmsText(e.target.value)}\n              style={{ backgroundColor: theme.cardInner, borderColor: theme.border }}\n              className=\"w-full px-3.5 py-2.5 rounded-xl border text-xs text-slate-200\"\n            />\n            <button\n              onClick={runSmsScan}\n              style={{ backgroundColor: theme.primary }}\n              className=\"w-full py-3 rounded-xl text-white text-xs font-semibold flex items-center justify-center gap-2 cursor-pointer\"\n            >\n              <MessageSquare className=\"w-4 h-4\" /> Analyze SMiShing Indicators\n            </button>\n          </div>\n          <div style={{ backgroundColor: theme.card, borderColor: theme.border }} className=\"lg:col-span-7 border rounded-2xl p-5 space-y-4\">\n            {smsResult && (\n              <>\n                <div className=\"flex items-center justify-between pb-3 border-b border-white/10\">\n                  <div className=\"flex items-center gap-2.5\">\n                    <span className=\"text-2xl font-bold text-white\">{smsResult.score}/100</span>\n                    <span className={`px-2.5 py-1 rounded-lg text-xs font-bold ${getRiskBadge(smsResult.score)}`}>{smsResult.classification}</span>\n                  </div>\n                  <button\n                    onClick={() => attachIndicatorToCase('Phone', smsSender, smsResult.score, 'SMS Detector')}\n                    style={{ backgroundColor: theme.primary }}\n                    className=\"px-3 py-1.5 rounded-xl text-white text-xs font-semibold cursor-pointer\"\n                  >\n                    + Add Sender to Case\n                  </button>\n                </div>\n                <div className=\"space-y-2\">\n                  {smsResult.reasons.map((r, i) => (\n                    <div key={i} style={{ backgroundColor: theme.cardInner, borderColor: theme.border }} className=\"p-3 rounded-xl border text-xs\">\n                      <div className=\"flex justify-between font-semibold text-white mb-1\">\n                        <span>{r.factor}</span>\n                        <span className=\"text-red-400 font-mono\">{r.weight}</span>\n                      </div>\n                      <p className=\"text-slate-400\">{r.detail}</p>\n                    </div>\n                  ))}\n                </div>\n              </>\n            )}\n          </div>\n        </div>\n      </div>\n    );\n  };\n\n  const renderOsintInvestigator = () => {\n    const samples = {\n      crypto: {\n        title: 'Celebrity Deepfake Crypto Giveaway Poster',\n        ocrText: 'OFFICIAL 2026 GLOBAL RELIEF & TECH FOUNDER GIVEAWAY! Send 0.2 ETH or 500 USDT to receive 2X BACK INSTANTLY. Scan QR or visit eth-foundation-bonus2026.xyz.',\n        claimVerification: 'REFUTED — Official foundation channels confirmed zero giveaway campaigns.',\n        extractedDomain: 'eth-foundation-bonus2026.xyz',\n        risk: 92\n      },\n      grant: {\n        title: 'Fake Sovereign C
